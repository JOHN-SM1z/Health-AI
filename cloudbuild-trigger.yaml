# Health AI — Cloud Build trigger on push to main.
#
#   gcloud beta builds triggers create github \
#     --repo-owner=YOUR_GITHUB_ORG --repo-name=YOUR_REPO \
#     --branch-pattern="^main$" --build-config=cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_PUBLIC_URL=https://YOUR_DOMAIN

description: "Health AI — deploy on push to main"
github:
  owner: YOUR_GITHUB_ORG
  name: YOUR_REPO
  push:
    branch: "^main$"
filename: cloudbuild.yaml
substitutions:
  _REGION: us-central1
  _PUBLIC_URL: https://YOUR_DOMAIN